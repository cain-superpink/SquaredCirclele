<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A daily wrestling guessing game">
    <meta name="keywords" content="wordle, daily, wrestling, game, cagematch, rating">
    <title>Wrestle Matchle</title>
    <script type="module" src="app.js"></script>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" type="image/png" href="./Resources/noun-wrestling-8202617.png">

</head>

<body>
    <h1 class="headingText">Who has the higher Cagematch Score?</h1>
    <div id="gameContainer" class="hidden">
        <p id="answer">&nbsp;</p>
        <p id="scoreText"></p>
        <div id="scoreContainer">
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
            <div class="scoreCircle"></div>
        </div>
        <div id="pickerBox">
            <div class="choiceBox" id="WrestlerOne">
                <p id="WrestlerOneName" class="nameText"></p>
                <div class="ratingText" id="WrestlerOneRating"></div>
            </div>
            <div class="choiceBox" id="WrestlerTwo">
                <p id="WrestlerTwoName" class="nameText"> </p>
                <div class="ratingText" id="WrestlerTwoRating"></div>
            </div>
        </div>
        <div id="nextbtn">
            Next
        </div>
    </div>
    <div id="startbtn">
        Start Game
    </div>
    <p class="endText hidden">Come back tomorrow to play again</p>
    </div>
</body>

</html>
